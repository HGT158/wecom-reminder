<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F5EF">
<title>编辑提醒 · 待办提醒</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/600.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="header">
    <h1><img class="logo-img" src="/static/logo.png" alt="待办提醒">编辑提醒</h1>
    <a class="back" href="/">‹ 返回列表</a>
  </header>

  {% if banner %}<div class="banner">{{ banner }}</div>{% endif %}

  <section class="card">
    <form method="post" action="/task/{{ t_id }}/edit">
      <label>要办什么事</label>
      <textarea name="content" rows="2" required>{{ content }}</textarea>

      <label>什么时候提醒</label>
      <input type="hidden" name="remind_at" id="remindAt">
      <div class="dtfield" id="dtField">
        <input type="text" id="dtDisplay" class="dt-display" placeholder="点此选择日期和时间" readonly>
        <div class="dt-pop" id="dtPop" hidden>
          <div class="dt-head">
            <button type="button" class="dt-nav" id="dtPrev">‹</button>
            <span class="dt-month" id="dtMonth"></span>
            <button type="button" class="dt-nav" id="dtNext">›</button>
          </div>
          <div class="dt-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="dt-grid" id="dtGrid"></div>
          <div class="dt-time">
            <div class="wheel-wrap"><div class="wheel" id="wheelH"></div><div class="wheel-band"></div></div>
            <span class="dt-colon">:</span>
            <div class="wheel-wrap"><div class="wheel" id="wheelM"></div><div class="wheel-band"></div></div>
            <button type="button" class="dt-mini" id="dtNow">此刻</button>
          </div>
          <div class="dt-hint" id="dtHint" hidden></div>
          <div class="dt-actions">
            <button type="button" class="dt-mini" id="dtClear">清除</button>
            <button type="button" class="dt-ok" id="dtOk">确 定</button>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>没完成时怎么催</label>
          <div class="dd">
            <button type="button" class="dd-btn"><span class="dd-val">{{ nag_label }}</span><span class="dd-caret">▾</span></button>
            <div class="dd-pop" hidden>
              {% for o in nag_opts %}
              <button type="button" class="dd-opt{% if o.sel %} sel{% endif %}" data-v="{{ o.v }}">{{ o.label }}</button>
              {% endfor %}
            </div>
            <input type="hidden" name="nag" value="{{ nag_v if nag_v is defined else '' }}">
          </div>
        </div>
        <div>
          <label>重复</label>
          <div class="dd">
            <button type="button" class="dd-btn"><span class="dd-val">{{ rep_label }}</span><span class="dd-caret">▾</span></button>
            <div class="dd-pop" hidden>
              {% for o in rep_opts %}
              <button type="button" class="dd-opt{% if o.sel %} sel{% endif %}" data-v="{{ o.v }}">{{ o.label }}</button>
              {% endfor %}
            </div>
            <input type="hidden" name="repeat" value="{{ rep_v if rep_v is defined else '' }}">
          </div>
        </div>
      </div>

      <button class="primary" type="submit">保存修改</button>
      <a class="cancel" href="/">取消，返回列表</a>
    </form>
  </section>
</main>
<script>
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const dtField = document.getElementById('dtField');
const dtDisplay = document.getElementById('dtDisplay');
const dtPop = document.getElementById('dtPop');
const dtGrid = document.getElementById('dtGrid');
const dtMonth = document.getElementById('dtMonth');
const wheelH = document.getElementById('wheelH');
const wheelM = document.getElementById('wheelM');
const remindAt = document.getElementById('remindAt');
const ITEM_H = () => (wheelH.children[0] ? wheelH.children[0].offsetHeight : 34);
let view = new Date(); view.setDate(1);
let sel = null;

function buildWheel(el, count, def, minV){
  el.dataset.min = minV;
  const start = Math.max(0, Math.min(count - 1, Math.max(def, minV)));
  el.dataset.v = start;
  el.innerHTML = '';
  for(let i = 0; i < count; i++){
    const d = document.createElement('div');
    d.className = 'wheel-item' + (i < minV ? ' disabled' : '');
    d.textContent = pad(i); d.dataset.v = i;
    el.appendChild(d);
  }
  let raf = null;
  el.addEventListener('scroll', () => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      let idx = Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / ITEM_H())));
      if(el.children[idx] && el.children[idx].classList.contains('disabled')){
        idx = +el.dataset.min;
        el.scrollTo({ top: idx * ITEM_H() });
      }
      if(el.dataset.v !== String(idx)){
        el.dataset.v = idx;
        el.querySelectorAll('.wheel-item.sel').forEach(x => x.classList.remove('sel'));
        if(el.children[idx]) el.children[idx].classList.add('sel');
        if(el === wheelH) applyMinuteMin();
        syncValue();
      }
    });
  });
  el.addEventListener('click', e => {
    const it = e.target.closest('.wheel-item');
    if(!it || it.classList.contains('disabled')) return;
    el.scrollTo({ top: (+it.dataset.v) * ITEM_H(), behavior: 'smooth' });
  });
}
function setWheel(el, v){
  v = Math.max(+el.dataset.min || 0, v);
  el.dataset.v = v;
  el.scrollTo({ top: v * ITEM_H() });
  el.querySelectorAll('.wheel-item.sel').forEach(x => x.classList.remove('sel'));
  if(el.children[v]) el.children[v].classList.add('sel');
}
function wheelLimits(){
  if(!sel) return { minH: 0, minM: 0 };
  const n = new Date();
  if(sel.getFullYear() !== n.getFullYear() || sel.getMonth() !== n.getMonth() || sel.getDate() !== n.getDate())
    return { minH: 0, minM: 0 };
  return { minH: n.getHours(), minM: n.getMinutes() };
}
function applyMinuteMin(){
  const { minH, minM } = wheelLimits();
  const min = (+wheelH.dataset.v === minH) ? minM : 0;
  if(+wheelM.dataset.min !== min){
    buildWheel(wheelM, 60, Math.max(+wheelM.dataset.v || 0, min), min);
    setWheel(wheelM, +wheelM.dataset.v);
  }
}
function applyLimits(){
  const { minH } = wheelLimits();
  buildWheel(wheelH, 24, +wheelH.dataset.v || 0, minH);
  setWheel(wheelH, +wheelH.dataset.v);
  applyMinuteMin();
  setWheel(wheelM, +wheelM.dataset.v);
}
function syncValue(){
  if(!sel){ remindAt.value=''; dtDisplay.value=''; return; }
  const h = pad(+wheelH.dataset.v || 0);
  const m = pad(+wheelM.dataset.v || 0);
  remindAt.value = `${fmtDate(sel)}T${h}:${m}`;
  dtDisplay.value = `${fmtDate(sel)} ${h}:${m}`;
}
function renderGrid(){
  dtMonth.textContent = `${view.getFullYear()}年${view.getMonth()+1}月`;
  dtGrid.innerHTML = '';
  const startDow = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
  const daysIn = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const now = new Date();
  document.getElementById('dtPrev').disabled =
    view.getFullYear() === now.getFullYear() && view.getMonth() === now.getMonth();
  for(let i=0;i<startDow;i++) dtGrid.appendChild(document.createElement('span'));
  for(let d=1; d<=daysIn; d++){
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = d;
    const cur = new Date(view.getFullYear(), view.getMonth(), d);
    if(cur.getTime() < today.getTime()){
      btn.classList.add('disabled');
    } else {
      if(sel && cur.getTime() === sel.getTime()) btn.classList.add('sel');
      if(cur.getTime() === today.getTime()) btn.classList.add('today');
      btn.addEventListener('click', () => { sel = cur; applyLimits(); renderGrid(); syncValue(); });
    }
    dtGrid.appendChild(btn);
  }
}
function closePopEl(el){
  if(el.hidden) return;
  el.classList.add('closing');
  setTimeout(() => { el.hidden = true; el.classList.remove('closing'); }, 150);
}
dtDisplay.addEventListener('click', () => {
  if(dtPop.hidden){
    dtPop.classList.remove('closing');
    dtPop.hidden = false;
    // 从已选完整时间恢复（含时分），而不是仅日期
    if(remindAt.value){
      const [dp, tp] = remindAt.value.split("T");
      const [Y, Mo, D] = dp.split("-").map(Number);
      const [H, M] = (tp || "00:00").split(":").map(Number);
      sel = new Date(Y, Mo-1, D);
      view = new Date(Y, Mo-1, 1);
      renderGrid();
      applyLimits();
      setWheel(wheelH, H);
      applyMinuteMin();
      setWheel(wheelM, M);
      syncValue();
    } else {
      renderGrid();
      applyLimits();
      syncValue();
    }
  } else {
    closePopEl(dtPop);
  }
});
document.getElementById('dtPrev').addEventListener('click', () => { view.setMonth(view.getMonth()-1); renderGrid(); });
document.getElementById('dtNext').addEventListener('click', () => { view.setMonth(view.getMonth()+1); renderGrid(); });
document.getElementById('dtNow').addEventListener('click', () => {
  const n = new Date();
  sel = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  applyLimits();
  setWheel(wheelH, n.getHours());
  applyMinuteMin();
  setWheel(wheelM, n.getMinutes());
  renderGrid(); syncValue();
});
document.getElementById('dtClear').addEventListener('click', () => {
  sel = null; syncValue(); closePopEl(dtPop);
});
const dtHint = document.getElementById('dtHint');
let hintTimer = null;
function showHint(msg){
  dtHint.textContent = msg;
  dtHint.hidden = false;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { dtHint.hidden = true; }, 2200);
}
document.getElementById('dtOk').addEventListener('click', () => {
  if(!sel) sel = new Date(new Date().setHours(0,0,0,0));
  const chosen = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate(),
                          +wheelH.dataset.v || 0, +wheelM.dataset.v || 0);
  const now = new Date();
  if(chosen <= now){
    const t = new Date(now.getTime() + 60000);
    sel = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    setWheel(wheelH, t.getHours()); setWheel(wheelM, t.getMinutes());
    view = new Date(t.getFullYear(), t.getMonth(), 1);
    renderGrid(); syncValue();
    showHint('已自动调整到最近的可选时间');
    return;
  }
  syncValue(); closePopEl(dtPop);
});
document.addEventListener('click', e => {
  const path = e.composedPath();
  if(!path.includes(dtField)) closePopEl(dtPop);
  document.querySelectorAll('.dd').forEach(dd => { if(!path.includes(dd)) closePopEl(dd.querySelector('.dd-pop')); });
});

document.querySelectorAll('.dd').forEach(initDD);
function initDD(root){
  const btn = root.querySelector('.dd-btn');
  const pop = root.querySelector('.dd-pop');
  const hidden = root.querySelector('input[type=hidden]');
  const val = root.querySelector('.dd-val');
  btn.addEventListener('click', () => {
    if(pop.hidden){
      document.querySelectorAll('.dd-pop').forEach(p => { if(p !== pop) closePopEl(p); });
      pop.classList.remove('closing');
      pop.hidden = false;
    } else {
      closePopEl(pop);
    }
  });
  pop.querySelectorAll('.dd-opt').forEach(o => o.addEventListener('click', () => {
    pop.querySelectorAll('.dd-opt.sel').forEach(x => x.classList.remove('sel'));
    o.classList.add('sel');
    hidden.value = o.dataset.v;
    val.textContent = o.textContent;
    closePopEl(pop);
  }));
}

// 用任务当前值初始化
const iso = "{{ dt_iso }}";
const [dp, tp] = iso.split("T");
const [Y, Mo, D] = dp.split("-").map(Number);
const [H, Mi] = tp.split(":").map(Number);
sel = new Date(Y, Mo-1, D);
view = new Date(Y, Mo-1, 1);
renderGrid();
applyLimits();
setWheel(wheelH, H);
applyMinuteMin();
setWheel(wheelM, Mi);
syncValue();

document.querySelector('form').addEventListener('submit', e => {
  if(!remindAt.value){
    e.preventDefault();
    alert('请先选择提醒时间');
    dtPop.hidden = false; renderGrid();
  }
});
</script>
</body>
</html>
